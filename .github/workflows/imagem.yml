name: Imagem Docker

# Publica ghcr.io/jeipidevs/anti-rea:<tag> e :latest a cada tag v* (por exemplo v0.1.0).
on:
  push:
    tags: ["v*"]

# Cada uses: fica preso ao commit (a versão vai no comentário): este job publica com packages: write.
# O Dependabot (.github/dependabot.yml) propõe as versões novas.
permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jeipidevs/anti-rea:${{ github.ref_name }}
            ghcr.io/jeipidevs/anti-rea:latest
