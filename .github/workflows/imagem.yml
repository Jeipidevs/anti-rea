name: Imagem Docker

# Publica ghcr.io/jeipidevs/anti-rea:<tag> e :latest a cada tag v* (por exemplo v0.1.0).
on:
  push:
    tags: ["v*"]

# Cada uses: fica preso ao commit (a versão vai no comentário): este job publica com packages: write.
# O Dependabot (.github/dependabot.yml) propõe as versões novas.
permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jeipidevs/anti-rea:${{ github.ref_name }}
            ghcr.io/jeipidevs/anti-rea:latest
