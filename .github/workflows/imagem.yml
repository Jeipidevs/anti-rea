name: Imagem Docker

# Publica ghcr.io/jeipidevs/anti-rea:<tag> e :latest a cada tag v* (por exemplo v0.1.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jeipidevs/anti-rea:${{ github.ref_name }}
            ghcr.io/jeipidevs/anti-rea:latest
