name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Sem wget e httrack os casos deles pulam no runner e nunca rodam de verdade.
      - run: |
          sudo apt-get update
          sudo apt-get install -y wget httrack
      - run: npm run test:e2e
