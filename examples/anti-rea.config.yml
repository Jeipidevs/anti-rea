# Configuração do ANTI-REA. Cada linha tem a explicação ao lado.
# Guia completo: docs/03-configurar.md

upstream: http://localhost:3000     # onde o seu site real roda
domains:
  - seusite.com.br                  # domínios que este porteiro protege
trustProxy: false                   # true atrás de nginx/Traefik; "cloudflare" atrás da Cloudflare

check:
  firstVisit: true                  # verificação de menos de 1 s na primeira visita
  devtoolsIsCaught: true            # quem abre o F12 cai na sombra
  passDuration: 7d                  # tempo que o visitante verificado navega livre

exempt:                             # caminhos de máquina, sem verificação
  - /api/webhook/*
  - /health

shadow:
  language: pt-BR
  title: "Ops. Pegamos você."
  message: "Belo esforço com o seu robô. O código que você queria não mora aqui."
  footer: "Que tal criar o seu? Dá menos trabalho e é mais divertido."
  showIp: true

alerts:
  channels: [whatsapp]              # whatsapp, telegram, webhook
  groupByIp: 1h                     # um aviso por IP por hora, com a contagem
  scans: panel                      # varredura genérica: panel, dailySummary ou alert

log:
  retention: 30d                    # apaga registros mais velhos (LGPD)
