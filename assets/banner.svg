    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45"><stop offset="0" stop-color="#7C6CFF" stop-opacity="0.35"/><stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
