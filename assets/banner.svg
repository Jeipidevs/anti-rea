  <text x="84" y="300" fill="#EEF0FF" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">ANTI-REA</text>
  <text x="86" y="350" fill="#B3A9FF" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500">Quem tenta copiar seu site leva só a sombra.</text>
  <text x="86" y="390" fill="#8A90B2" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">Porteiro open source contra engenharia reversa, robôs copiadores e varredura de ataque.</text>
