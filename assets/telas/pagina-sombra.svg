  <text x="640" y="636" text-anchor="middle" fill="#5A6088" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Mensagem padrão. Cada site troca pelo próprio texto.</text>
