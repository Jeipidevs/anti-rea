    <text x="468" y="482" fill="#8A90B2">tentativa</text><text x="812" y="482" text-anchor="end" fill="#FF8DA2">registrada</text>
    <text x="468" y="514" fill="#8A90B2">seu IP</text><text x="812" y="514" text-anchor="end" fill="#EEF0FF">203.0.113.42</text>
