  <text x="640" y="320" text-anchor="middle" fill="#EEF0FF" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Ops. Pegamos você.</text>
  <text x="640" y="368" text-anchor="middle" fill="#B3A9FF" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22">Belo esforço com o seu robô. O código que você queria não mora aqui.</text>
  <text x="640" y="402" text-anchor="middle" fill="#8A90B2" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">Que tal criar o seu? Dá menos trabalho e é mais divertido.</text>
